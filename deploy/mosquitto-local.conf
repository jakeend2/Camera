# Listen on all interfaces so devices elsewhere in the house (ratgdo, and
# later a Z-Wave JS gateway) can reach the broker. Authentication is
# mandatory - an open broker on the LAN means anyone on the WiFi can drive
# whatever is attached to it.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

# persistence, persistence_location and log_dest are already set in
# /etc/mosquitto/mosquitto.conf - repeating them here is a fatal error.
log_type warning
log_type error
log_type notice
