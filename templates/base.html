<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>LCARS Camera Control Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lcars.css') }}">
    <style>
      /* .lcars-header-primary and .lcars-header-elbow used to be repeated here.
         Both are defined in lcars.css, which also shrinks them at the 768px and
         480px breakpoints - but this inline block loads after the stylesheet and
         carried no media queries of its own, so it pinned the elbow at
         left:120px on every screen size. On a phone its neighbours shrank to
         80px and 20px while the elbow stayed put, leaving a black tab stranded
         on top of the orange banner. Header styling lives in lcars.css only. */
      
      
      /* Better responsive styles */
      @media (max-width: 768px) {
        .lcars-layout {
          grid-template-columns: 1fr;
          grid-template-rows: 60px auto auto auto;
          grid-template-areas:
            "header"
            "main"
            "left"
            "right";
          height: auto;
          min-height: 100vh;
        }
        
        .lcars-panel-left,
        .lcars-panel-right {
          margin-top: 15px;
        }
        
        .lcars-video-container {
          height: 250px;
        }
      }
    </style>
    {% block head %} {% endblock %}
  </head>
  <body>
    <!-- LCARS Grid Layout -->
    <div class="lcars-layout">
      <!-- LCARS Header -->
      <div class="lcars-header">
        <div class="lcars-header-bar">
          <div class="lcars-header-primary">LCARS</div>
          <div class="lcars-header-separator"></div>
          <div class="lcars-header-secondary">
            <div class="lcars-title">CAMERA CONTROL</div>
            <div id="clock"></div>
          </div>
          <div class="lcars-header-elbow"></div>
        </div>
      </div>

      <!-- Content will be inserted here by child templates -->
      {% block body %} {% endblock %}
    </div>

    <script src="{{ url_for('static', filename='vendor/jquery.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
    
    <!-- Header clock -->
    <script>
      // Local wall-clock time, formatted to match the timestamp burned into
      // the recordings so the two can be read against each other.
      // Date and time are separate elements so the date can be dropped on a
      // narrow screen without touching the layout. The full header - LCARS
      // block, title and a 19-character timestamp - needs 387px, more than a
      // 390px phone has, and the excess was being clipped by the overflow rule.
      const clockEl = document.getElementById('clock');
      clockEl.innerHTML =
        '<span class="clock-date"></span><span class="clock-time"></span>';
      const clockDate = clockEl.querySelector('.clock-date');
      const clockTime = clockEl.querySelector('.clock-time');

      function updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        clockDate.textContent =
          `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} `;
        clockTime.textContent =
          `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }

      updateClock();
      setInterval(updateClock, 1000);
    </script>
    
    {% block script %} {% endblock %}
  </body>
</html>
