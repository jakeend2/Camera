<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LCARS Camera Control Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lcars.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-primary">LCARS</div>
      <div class="topbar-gap"></div>
      <div class="topbar-secondary">
        <span class="topbar-title">CAMERA CONTROL</span>
        <span class="topbar-right">
          <span id="clock" class="topbar-clock"></span>
          {% if current_user.is_authenticated %}
          <a class="topbar-logout" href="{{ url_for('logout') }}">LOG OUT</a>
          {% endif %}
        </span>
      </div>
    </header>

    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </body>
</html>
