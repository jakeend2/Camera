<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>LCARS Camera Control Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lcars.css') }}">
    <style>
      /* Additional LCARS styling for base template */
      .lcars-header-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--lcars-black);
        font-weight: bold;
        font-size: 1rem;
      }
      
      .lcars-header-elbow {
        position: absolute;
        width: 30px;
        height: 15px;
        background-color: var(--lcars-black);
        left: 120px;
        top: 0;
        border-bottom-right-radius: var(--lcars-border-radius);
      }
      
      /* Better responsive styles */
      @media (max-width: 768px) {
        .lcars-layout {
          grid-template-columns: 1fr;
          grid-template-rows: 60px auto auto auto;
          grid-template-areas:
            "header"
            "main"
            "left"
            "right";
          height: auto;
          min-height: 100vh;
        }
        
        .lcars-panel-left,
        .lcars-panel-right {
          margin-top: 15px;
        }
        
        .lcars-video-container {
          height: 250px;
        }
      }
    </style>
    {% block head %} {% endblock %}
  </head>
  <body>
    <!-- LCARS Grid Layout -->
    <div class="lcars-layout">
      <!-- LCARS Header -->
      <div class="lcars-header">
        <div class="lcars-header-bar">
          <div class="lcars-header-primary">LCARS</div>
          <div class="lcars-header-separator"></div>
          <div class="lcars-header-secondary">
            <div class="lcars-title">CAMERA CONTROL</div>
            <div id="stardate"></div>
          </div>
          <div class="lcars-header-elbow"></div>
        </div>
      </div>

      <!-- Content will be inserted here by child templates -->
      {% block body %} {% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
    
    <!-- LCARS Stardate Script -->
    <script>
      function updateStardate() {
        const now = new Date();
        const year = now.getFullYear();
        const dayOfYear = Math.floor((now - new Date(year, 0, 0)) / 86400000);
        const stardate = Math.floor((year - 2000) * 1000 + dayOfYear);
        document.getElementById('stardate').textContent = `STARDATE ${stardate}`;
      }
      
      // Update stardate immediately and then every minute
      updateStardate();
      setInterval(updateStardate, 60000);
    </script>
    
    {% block script %} {% endblock %}
  </body>
</html>
