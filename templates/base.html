<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>LCARS Camera Control Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lcars.css') }}">
    <style>
      /* Additional LCARS styling for base template */
      .lcars-header-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--lcars-black);
        font-weight: bold;
        font-size: 1rem;
      }
      
      .lcars-header-elbow {
        position: absolute;
        width: 30px;
        height: 15px;
        background-color: var(--lcars-black);
        left: 120px;
        top: 0;
        border-bottom-right-radius: var(--lcars-border-radius);
      }
      
      /* Better responsive styles */
      @media (max-width: 768px) {
        .lcars-layout {
          grid-template-columns: 1fr;
          grid-template-rows: 60px auto auto auto;
          grid-template-areas:
            "header"
            "main"
            "left"
            "right";
          height: auto;
          min-height: 100vh;
        }
        
        .lcars-panel-left,
        .lcars-panel-right {
          margin-top: 15px;
        }
        
        .lcars-video-container {
          height: 250px;
        }
      }
    </style>
    {% block head %} {% endblock %}
  </head>
  <body>
    <!-- LCARS Grid Layout -->
    <div class="lcars-layout">
      <!-- LCARS Header -->
      <div class="lcars-header">
        <div class="lcars-header-bar">
          <div class="lcars-header-primary">LCARS</div>
          <div class="lcars-header-separator"></div>
          <div class="lcars-header-secondary">
            <div class="lcars-title">CAMERA CONTROL</div>
            <div id="clock"></div>
          </div>
          <div class="lcars-header-elbow"></div>
        </div>
      </div>

      <!-- Content will be inserted here by child templates -->
      {% block body %} {% endblock %}
    </div>

    <script src="{{ url_for('static', filename='vendor/jquery.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
    
    <!-- Header clock -->
    <script>
      // Local wall-clock time, formatted to match the timestamp burned into
      // the recordings so the two can be read against each other.
      function updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('clock').textContent =
          `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ` +
          `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }

      updateClock();
      setInterval(updateClock, 1000);
    </script>
    
    {% block script %} {% endblock %}
  </body>
</html>
