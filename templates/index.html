{% extends 'base.html' %}

{% block head %}
<!-- No additional head content needed -->
{% endblock %}

{% block body %}
<!-- Main Content - Video Display and Controls -->
<div class="lcars-content">
  <!-- Video Display -->
  <div class="lcars-video-container">
    <div class="lcars-video-frame">
      <img alt="Camera Feed" src="{{ url_for('camera')}}">
    </div>
  </div>
  
  <!-- Camera Control Section Header -->
  <div class="lcars-section-header-grid">
    <div class="lcars-section-header-grid-text">CAMERA CONTROL</div>
  </div>
  
  <!-- Direction Controls - Modern LCARS Grid Style -->
  <div class="lcars-control-grid">
    <!-- Control buttons - arranged in a grid -->
    <button class="thermal" onmousedown="Thermal_Camera();">THERMAL</button>
    <button class="focus-near" onmousedown="focus_near();">FOCUS-</button>
    <button class="up" onmousedown="tilt_up();" onmouseup="stop();">▲</button>
    <button class="focus-far" onmousedown="focus_far();">FOCUS+</button>
    <button class="wiper" onmousedown="Windshield_Wiper();">WIPER</button>
    
    <button class="visible" onmousedown="Visible_Light_Camera();">VISIBLE</button>
    <button class="left" onmousedown="pan_left();" onmouseup="stop();">◀</button>
    <button class="home" onmousedown="stop();">●</button>
    <button class="right" onmousedown="pan_right();" onmouseup="stop();">▶</button>
    <button class="osd" onmousedown="OSD_menu();">OSD</button>
    
    <button class="preset1" onmousedown="Tour_1();">TOUR 1</button>
    <button class="zoom-out" onmousedown="zoom_wide();" onmouseup="stop();">ZOOM-</button>
    <button class="down" onmousedown="tilt_down();" onmouseup="stop();">▼</button>
    <button class="zoom-in" onmousedown="zoom_tele();" onmouseup="stop();">ZOOM+</button>
    <button class="preset2" onmousedown="Tour_2();">TOUR 2</button>
  </div>
  
  <!-- Media Control Bar -->
  <div class="lcars-media-controls">
    <button class="lcars-media-button" onclick="Start_New_File();" title="Save Recording">⏺️</button>
    <button class="lcars-media-button" onclick="Goto_preset(1);" style="background-color: var(--lcars-purple); color: var(--lcars-black);">1</button>
    <button class="lcars-media-button" onclick="Goto_preset(2);" style="background-color: var(--lcars-purple); color: var(--lcars-black);">2</button>
    <button class="lcars-media-button" onclick="Goto_preset(3);" style="background-color: var(--lcars-purple); color: var(--lcars-black);">3</button>
    <button class="lcars-media-button" onclick="Set_preset(document.getElementById('flabber').value);" style="background-color: var(--lcars-orange); color: var(--lcars-black);">SET</button>
    <input type="text" id="flabber" style="width: 50px; background: var(--lcars-bg-dark); color: var(--lcars-text); border: 1px solid var(--lcars-purple); border-radius: 4px; text-align: center; padding: 5px;" placeholder="##">
    <button class="lcars-media-button" style="margin-left: auto; background-color: var(--lcars-red); color: var(--lcars-black);" onclick="Exit_program();" title="Exit System">⏻</button>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  // JavaScript functions for camera control  
  function pan_left() {
    var message = "pan left message"
    fetch('/pan_left', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function stop() {
    var message = "stop message"
    fetch('/stop', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function tilt_up() {
    var message = "tilt up message"
    fetch('/tilt_up', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function tilt_down() {
    var message = "tilt down message"
    fetch('/tilt_down', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function pan_right() {
    var message = "pan right message"
    fetch('/pan_right', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function zoom_tele() {
    var message = "zoom in message"
    fetch('/zoom_tele', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function zoom_wide() {
    var message = "zoom out message"
    fetch('/zoom_wide', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function focus_near() {
    var message = "focus near message"
    fetch('/focus_near', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function focus_far() {
    var message = "focus far message"
    fetch('/focus_far', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function OSD_menu() {
    var message = "osd menu message"
    fetch('/OSD_menu', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Goto_preset() {
    var presetNumber = document.getElementById("flabber").value;
    var message = "goto preset " + presetNumber + " message"
    fetch('/Goto_preset', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify({"flabber": presetNumber}),
      headers: new Headers({ "content-type": "application/json" })
    })
  }

  function Goto_preset(presetNum) {
    var message = "goto preset " + presetNum + " message"
    fetch('/Goto_preset', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify({"flabber": presetNum}),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Set_preset() {
    var presetNumber = document.getElementById("flabber").value;
    var message = "set preset " + presetNumber + " message"
    fetch('/Set_preset', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify({"flabber": presetNumber}),
      headers: new Headers({ "content-type": "application/json" })
    })
  }

  function Set_preset(presetNum) {
    if (!presetNum) {
      presetNum = document.getElementById("flabber").value;
    }
    var message = "set preset " + presetNum + " message"
    fetch('/Set_preset', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify({"flabber": presetNum}),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Thermal_Camera() {
    var message = "thermal camera message"
    fetch('/Thermal_Camera', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Visible_Light_Camera() {
    var message = "visible light camera message"
    fetch('/Visible_Light_Camera', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Tour_1() {
    var message = "tour 1 message"
    fetch('/Tour_1', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Tour_2() {
    var message = "tour 2 message"
    fetch('/Tour_2', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Windshield_Wiper() {
    var message = "windshield wiper message"
    fetch('/Windshield_Wiper', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Start_New_File() {
    var message = "save recording message"
    fetch('/Start_New_File', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
  
  function Exit_program() {
    var message = "exit program message"
    fetch('/Exit_program', {
      method: "POST",
      credentials: "include",
      body: JSON.stringify(message),
      headers: new Headers({ "content-type": "application/json" })
    })
  }
</script>
{% endblock %}
