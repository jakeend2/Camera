{% extends 'base.html' %}

{% block head %}
<!-- No additional head content needed -->
{% endblock %}

{% block body %}
<!-- Main Content - Video Display and Controls -->
<div class="lcars-content">
  <!-- Video Display -->
  <div class="lcars-video-container">
    <div class="lcars-video-frame">
      <img alt="Camera Feed" src="{{ url_for('camera')}}">
    </div>
  </div>
  
  <!-- Camera Control Section Header -->
  <div class="lcars-section-header-grid">
    <div class="lcars-section-header-grid-text">CAMERA CONTROL</div>
  </div>
  
  <!-- Direction Controls - Modern LCARS Grid Style -->
  <div class="lcars-control-grid">
    <!-- Control buttons - arranged in a grid -->
    <button class="thermal" onclick="Thermal_Camera();">THERMAL</button>
    <button class="focus-near" data-hold="focus_near">FOCUS-</button>
    <button class="up" data-hold="tilt_up">▲</button>
    <button class="focus-far" data-hold="focus_far">FOCUS+</button>
    <button class="wiper" onclick="Windshield_Wiper();">WIPER</button>
    
    <button class="visible" onclick="Visible_Light_Camera();">VISIBLE</button>
    <button class="left" data-hold="pan_left">◀</button>
    <button class="home" onclick="stop();">●</button>
    <button class="right" data-hold="pan_right">▶</button>
    <button class="osd" onclick="OSD_menu();">OSD</button>
    
    <button class="preset1" onclick="Tour_1();">TOUR 1</button>
    <button class="zoom-out" data-hold="zoom_wide">ZOOM-</button>
    <button class="down" data-hold="tilt_down">▼</button>
    <button class="zoom-in" data-hold="zoom_tele">ZOOM+</button>
    <button class="preset2" onclick="Tour_2();">TOUR 2</button>
  </div>
  
  <!-- Media Control Bar -->
  <div class="lcars-media-controls">
    <button class="lcars-media-button" onclick="Start_New_File();" title="Save Recording">⏺️</button>
    <button class="lcars-media-button" onclick="Goto_preset(1);" style="background-color: var(--lcars-panel); color: var(--lcars-orange); border: 2px solid var(--lcars-orange);">1</button>
    <button class="lcars-media-button" onclick="Goto_preset(2);" style="background-color: var(--lcars-panel); color: var(--lcars-orange); border: 2px solid var(--lcars-orange);">2</button>
    <button class="lcars-media-button" onclick="Goto_preset(3);" style="background-color: var(--lcars-panel); color: var(--lcars-orange); border: 2px solid var(--lcars-orange);">3</button>
    <button class="lcars-media-button" onclick="Set_preset(document.getElementById('flabber').value);" style="background-color: var(--lcars-orange); color: var(--lcars-black);">SET</button>
    <input type="text" id="flabber" class="lcars-preset-input" placeholder="##">
    <button class="lcars-media-button" style="margin-left: auto; background-color: var(--lcars-red); color: var(--lcars-black);" onclick="Exit_program();" title="Exit System">⏻</button>
  </div>
</div>
{% endblock %}

{% block script %}

  function Exit_program() {

    fetch('/Exit_program', {

  }
    // --- press and hold -------------------------------------------------
    // Pointer events, not mouse events. A phone does not deliver mousedown
    // while a finger is still down - it synthesises one after the gesture
    // ends, if at all - so the old handlers never started the movement, and
    // the long press fell through to text selection instead.
    const HOLD_ENDPOINTS = {
      pan_left: '/pan_left',     pan_right: '/pan_right',
      tilt_up: '/tilt_up',       tilt_down: '/tilt_down',
      zoom_tele: '/zoom_tele',   zoom_wide: '/zoom_wide',
      focus_near: '/focus_near', focus_far: '/focus_far'
    };

    function postCmd(path) {
      return fetch(path, {
        method: "POST",
        credentials: "include",
        body: JSON.stringify({}),
        headers: new Headers({ "content-type": "application/json" })
      });
    }

    let holding = null;

    function beginHold(btn, ev) {
      ev.preventDefault();          // suppress selection and the iOS callout
      if (holding) return;
      holding = btn;
      btn.classList.add('is-held');
      try { btn.setPointerCapture(ev.pointerId); } catch (e) {}
      postCmd(HOLD_ENDPOINTS[btn.dataset.hold]);
    }

    function endHold() {
      if (!holding) return;
      holding.classList.remove('is-held');
      holding = null;
      postCmd('/stop');
    }

    document.querySelectorAll('[data-hold]').forEach(function (btn) {
      btn.addEventListener('pointerdown', function (ev) { beginHold(btn, ev); });
      btn.addEventListener('pointerup', endHold);
      btn.addEventListener('pointercancel', endHold);
      btn.addEventListener('lostpointercapture', endHold);
      btn.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    });

    // If the finger slides off, or the page is backgrounded mid hold, the
    // pointerup may never reach the element - and the camera would keep
    // panning. Always stop.
    window.addEventListener('pointerup', endHold);
    window.addEventListener('blur', endHold);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) endHold();
    });

</script>
