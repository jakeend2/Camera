{% extends "base.html" %}

{% block body %}
<main class="login-wrap">
  <div class="login-panel">
    <div class="login-bar"></div>
    <div class="login-body">
      <h2 class="login-title">AUTHORIZATION REQUIRED</h2>

      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" autocomplete="off">
        <label class="login-label" for="username">OPERATOR</label>
        <input class="login-input" type="text" id="username" name="username"
               autocomplete="username" required autofocus>

        <label class="login-label" for="password">ACCESS CODE</label>
        <input class="login-input" type="password" id="password" name="password"
               autocomplete="current-password" required>

        <button class="login-button" type="submit">ENGAGE</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
