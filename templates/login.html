{% extends "base.html" %}

{% block body %}
<div class="lcars-login-wrap">
  <div class="lcars-login-panel">
    <div class="lcars-login-bar"></div>
    <div class="lcars-login-body">
      <h2 class="lcars-login-title">AUTHORIZATION REQUIRED</h2>

      {% if error %}
      <p class="lcars-login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" autocomplete="off">
        <label class="lcars-login-label" for="username">OPERATOR</label>
        <input class="lcars-login-input" type="text" id="username" name="username"
               autocomplete="username" required autofocus>

        <label class="lcars-login-label" for="password">ACCESS CODE</label>
        <input class="lcars-login-input" type="password" id="password" name="password"
               autocomplete="current-password" required>

        <button class="lcars-login-button" type="submit">ENGAGE</button>
      </form>
    </div>
  </div>
</div>

<style>
  .lcars-login-wrap {
    /* base.html's .lcars-layout is a CSS grid whose columns are 0 1fr 0.
       Without claiming the 'main' area this lands in the zero-width left
       column and vanishes. */
    grid-area: main;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    width: 100%;
  }
  .lcars-login-panel {
    display: flex;
    width: 100%;
    max-width: 30rem;
    background: var(--lcars-black, #000);
    border-radius: 0 1.5rem 1.5rem 0;
    overflow: hidden;
  }
  .lcars-login-bar {
    flex: 0 0 2rem;
    background: var(--lcars-orange, #ff9c00);
  }
  .lcars-login-body { flex: 1; padding: 1.5rem; }
  .lcars-login-title {
    color: var(--lcars-orange, #ff9c00);
    font-family: 'LCARS', sans-serif;
    letter-spacing: 0.1em;
    font-size: 1.25rem;
    margin: 0 0 1.25rem;
  }
  .lcars-login-label {
    display: block;
    color: var(--lcars-blue, #99f);
    font-family: 'LCARS', sans-serif;
    letter-spacing: 0.08em;
    font-size: 0.8rem;
    margin: 0.75rem 0 0.25rem;
  }
  .lcars-login-input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: none;
    border-radius: 0.75rem;
    background: #1a1a1a;
    color: #fff;
    font-size: 1rem;
  }
  .lcars-login-input:focus {
    outline: 2px solid var(--lcars-orange, #ff9c00);
  }
  .lcars-login-button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.7rem;
    border: none;
    border-radius: 1.25rem;
    background: var(--lcars-orange, #ff9c00);
    color: #000;
    font-family: 'LCARS', sans-serif;
    font-weight: bold;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  .lcars-login-button:hover { background: var(--lcars-orange-brown, #ff8a00); }
  .lcars-login-error {
    background: var(--lcars-red, #c66);
    color: #000;
    padding: 0.6rem 0.85rem;
    border-radius: 0.75rem;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
  }
</style>
{% endblock %}
