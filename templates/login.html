{% extends "base.html" %}

{% block body %}
<main class="login-wrap">
  <div class="login-panel">
    <div class="login-bar"></div>
    <div class="login-body">
      <h2 class="login-title">AUTHORIZATION REQUIRED</h2>

      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" autocomplete="off">
        <label class="login-label" for="pin">ACCESS CODE</label>
        <input class="login-input pin-input" type="password" id="pin" name="pin"
               inputmode="numeric" pattern="[0-9]*" maxlength="4" minlength="4"
               autocomplete="one-time-code" autofocus required
               {% if error %}value="{{ request.form.pin }}"{% endif %}>

        <button class="login-button" type="submit">ENGAGE</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
